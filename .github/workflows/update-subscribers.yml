on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch subscriber list
        id: subs
        run: |
          curl -sSL "https://raw.githubusercontent.com/alex-migwi/spec-subscribers/main/subscribers.yaml" \
            -o /tmp/subscribers.yaml
          echo "count=$(grep -c '^- ' /tmp/subscribers.yaml)" >> "$GITHUB_OUTPUT"

      - name: Dispatch to each subscriber
        run: |
          while IFS= read -r repo; do
            [[ -z "$repo" || "$repo" == \#* ]] && continue
            echo "📡 Dispatching to $repo"
            curl -sSL -X POST \
              -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}"
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/dispatches" \
              -d "{\"event_type\":\"spec-updated\",\"client_payload\":{\"sha\":\"${{ github.sha }}\"}}"
          done < /tmp/subscribers.yaml