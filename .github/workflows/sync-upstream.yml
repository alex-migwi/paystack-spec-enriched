name: Sync & Build Enriched Spec

on:
  workflow_dispatch: # Manual trigger

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    # grant only the minimum permissions needed to open a PR
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with: 
          token: ${{ secrets.GITHUB_TOKEN }}  

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Upstream Paystack Spec
        run: npm run sync

      - name: Build Enriched OpenAPI Spec
        run: npm run build

      - name: Lint Enriched Spec
        run: npm run lint

      - name: Create Isolated Spec Update PR via GitHub Bot
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated update to enriched spec file"
          title: "Automated Spec Update"
          body: "This PR was securely opened by the GitHub Action Bot. It strictly contains updates to enriched sec file."
          branch: "automation/enriched-spec-update"
          base: main
          reviewers: "alex-migwi"
          
          # This discard ANY changes made outside of this explicit path.
          add-paths: |
            spec/upstream/paystack.yaml
            dist/*
